<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilo.css">
    <script>
        function validarFormulario() {
            var senha = document.getElementById("senha").value;
            if (senha.length < 4) {
                alert("A senha deve ter pelo menos 4 caracteres.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-gradiente">
            <a class="navbar-brand font-weight-bold text-warning" href="index.html">DofusNDragons</a>
            <ul class="nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container container-box" style="max-width: 600px;">
        <h2 class="text-center font-weight-bold">Cadastro de Perfil</h2>
        <hr class="linha-tema">

        <form method="post" action="cadastrar.php" onsubmit="return validarFormulario();">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="foto_url">URL da Foto de Perfil (opcional)</label>
                <input type="url" class="form-control" id="foto_url" name="foto_url" placeholder="https://...">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>

            <hr class="linha-tema">
            <div class="text-center">
                <button type="submit" class="btn btn-warning font-weight-bold px-5">Cadastrar</button>
            </div>
        </form>
    </div>

    <footer class="text-center text-muted py-4">
        <small>DofusNDragons — Gerenciador de Mesas de RPG</small>
    </footer>
</body>
</html>
